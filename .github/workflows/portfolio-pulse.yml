name: Update Portfolio Pulse

on:
  schedule:
    - cron: "20 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate live metrics with Python
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_portfolio_pulse.py

      - name: Commit updated panel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/portfolio-pulse.svg
          git diff --cached --quiet || git commit -m "chore: update portfolio pulse"
          git push
